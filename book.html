<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Play | Book A Slot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050505; color: #ffffff; font-family: 'Rajdhani', sans-serif;
            background-image: radial-gradient(circle at top, #1a0b2e 0%, #050505 100%);
            min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column;
        }

        h1, h2, h3, .brand { font-family: 'Orbitron', sans-serif; }
        
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 50px; background: rgba(5, 5, 5, 0.8); 
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(176, 38, 255, 0.3); 
            position: fixed; width: 100%; top: 0; z-index: 100; 
        }
        
        .brand { font-size: 1.8rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px #b026ff; text-decoration: none; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 1.2rem; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; }
        .nav-links a:hover, .nav-links a.active { color: #00e5ff; text-shadow: 0 0 8px #00e5ff; }
        .hamburger { display: none; font-size: 2rem; color: #00e5ff; cursor: pointer; background: none; border: none; }

        .page-container { margin-top: 120px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 0 20px; margin-bottom: 50px; }
        .glow-title { text-shadow: 0 0 15px #b026ff, 0 0 30px #b026ff; font-size: 3rem; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 30px; text-align: center; }

        .glass-panel {
            background: rgba(15, 15, 15, 0.7); border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 40px; border-radius: 8px; width: 100%; max-width: 500px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); text-align: center; transition: 0.3s;
        }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; color: #00e5ff; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        input, select {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333; color: #fff; border-radius: 4px;
            font-size: 1.1rem; font-family: 'Rajdhani', sans-serif; transition: 0.3s;
        }
        input:focus, select:focus { outline: none; border-color: #b026ff; box-shadow: 0 0 10px rgba(176, 38, 255, 0.3); }
        select:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-google {
            background: #fff; color: #050505; border: none; padding: 15px; width: 100%;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 4px;
            display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; margin-top: 15px;
        }
        .btn-google:hover { background: #ccc; }
        
        .btn-auth {
            background: #b026ff; color: #fff; border: none; padding: 15px; width: 100%;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 4px;
            text-transform: uppercase; transition: 0.3s; margin-top: 10px; letter-spacing: 1px;
        }
        .btn-auth:hover { background: #901ad6; box-shadow: 0 0 15px #b026ff; }

        .btn-neon { 
            background: transparent; color: #00e5ff; border: 2px solid #00e5ff; 
            padding: 15px; width: 100%; font-size: 1.2rem; font-weight: bold; 
            text-transform: uppercase; cursor: pointer; border-radius: 4px; 
            box-shadow: 0 0 10px #00e5ff inset; transition: 0.3s ease-in-out; letter-spacing: 1px; margin-top: 10px;
        }
        .btn-neon:hover:not(:disabled) { background: #00e5ff; color: #050505; box-shadow: 0 0 20px #00e5ff, 0 0 40px #00e5ff; }
        .btn-neon:disabled { border-color: #555; color: #555; box-shadow: none; cursor: not-allowed; }

        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #555; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #333; }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }

        #booking-section { display: none; }
        #user-info { color: #aaa; margin-bottom: 20px; font-size: 1rem; }
        #status-display { margin-bottom: 15px; font-size: 1.2rem; font-weight: bold; min-height: 28px; transition: 0.3s; }

        footer { text-align: center; padding: 30px; background: #020202; color: #555; font-size: 0.9rem; margin-top: auto; border-top: 1px solid #111; }

        @media (max-width: 768px) {
            nav { padding: 20px; }
            .hamburger { display: block; }
            .nav-links { display: none; flex-direction: column; position: absolute; top: 70px; left: 0; width: 100%; background: rgba(5, 5, 5, 0.95); border-bottom: 1px solid rgba(176, 38, 255, 0.3); padding: 20px 0; text-align: center; }
            .nav-links.active { display: flex; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand">JUST PLAY</a>
        <button class="hamburger" onclick="toggleMenu()">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="pricing.html">Pricing & Plans</a>
            <a href="book.html" class="active">Book Slot</a>
        </div>
    </nav>

    <div class="page-container">
        <h1 class="glow-title">SECURE YOUR SLOT</h1>

        <!-- AUTHENTICATION SECTION -->
        <div class="glass-panel" id="auth-section">
            <h2 id="auth-title" style="margin-bottom: 10px; color: #fff;">IDENTIFICATION REQUIRED</h2>
            <p id="auth-subtitle" style="color: #aaa; margin-bottom: 25px;">Sign in to view availability.</p>
            
            <div class="input-group">
                <input type="email" id="auth-email" placeholder="Email Address" required>
            </div>
            <div class="input-group" style="margin-bottom: 10px;">
                <input type="password" id="auth-password" placeholder="Password" required>
            </div>
            
            <button class="btn-auth" id="btn-primary-auth">Log In</button>
            
            <p style="margin-top: 15px; color: #aaa; font-size: 0.95rem;">
                <span id="auth-toggle-text">Don't have an account?</span> 
                <a href="#" id="auth-toggle-link" style="color: #00e5ff; text-decoration: none; font-weight: bold;">Create Account</a>
            </p>

            <div class="divider">OR</div>

            <button class="btn-google" id="google-login-btn">
                <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Sign In with Google
            </button>
        </div>

        <!-- BOOKING FORM SECTION -->
        <div class="glass-panel" id="booking-section">
            <div id="user-info">Logged in as: <span id="display-email" style="color:#00e5ff; font-weight: bold;"></span> <button id="btn-logout" style="background:none; border:none; color: #b026ff; cursor: pointer; text-decoration: underline; margin-left: 10px;">(Logout)</button></div>
            
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="booking-name" placeholder="e.g. Aditya" required>
            </div>

            <div class="input-group">
                <label>Select Arsenal</label>
                <select id="console-type" class="check-trigger" required>
                    <option value="" disabled selected>Select a station...</option>
                    <option value="PC">High-End PC (2 Available)</option>
                    <option value="PS5_42">PS5 - 42" Display (2 Available)</option>
                    <option value="PS5_65">PS5 MAX - 65" Display (2 Available)</option>
                    <option value="SIM">Sim Racing Rig (2 Available)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Date</label>
                <input type="date" id="booking-date" class="check-trigger" required>
            </div>

            <div class="input-group">
                <label>Arrival Time</label>
                <select id="booking-time" class="check-trigger" disabled required>
                    <option value="" disabled selected>Select a date first...</option>
                </select>
            </div>

            <div class="input-group">
                <label>Duration</label>
                <select id="booking-duration" class="check-trigger" required>
                    <option value="" disabled selected>How long are you playing?</option>
                    <option value="0.5">30 Minutes</option>
                    <option value="1">1 Hour</option>
                    <option value="1.5">1.5 Hours</option>
                    <option value="2">2 Hours</option>
                    <option value="3">3 Hours</option>
                    <option value="4">4 Hours</option>
                    <option value="5">5+ Hours</option>
                </select>
            </div>

            <div class="input-group">
                <label>Phone Number (Optional)</label>
                <input type="tel" id="booking-phone" placeholder="e.g. 9876543210">
            </div>

            <!-- LIVE STATUS DISPLAY -->
            <div id="status-display"></div>

            <button class="btn-neon" id="submit-booking" disabled>Confirm Booking</button>
        </div>
    </div>

    <footer><p>Engineered by CODOT</p></footer>

    <script>
        function toggleMenu() { document.getElementById("navLinks").classList.toggle("active"); }

        // Block past dates
        const now = new Date();
        const todayString = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        const dateInput = document.getElementById('booking-date');
        const timeSelect = document.getElementById('booking-time');
        dateInput.setAttribute('min', todayString);

        // Smart Time Generator
        dateInput.addEventListener('change', (e) => {
            const selectedDateString = e.target.value;
            const selectedDate = new Date(selectedDateString);
            const day = selectedDate.getDay();
            
            timeSelect.innerHTML = '<option value="" disabled selected>Select an arrival time...</option>';
            timeSelect.disabled = false;
            
            let startHour = (day === 0) ? 10 : 11;
            let startMin = (day === 0) ? 30 : 0;
            let endHour = (day === 0) ? 21 : 20;
            let endMin = (day === 0) ? 0 : 30;
            
            let curH = startHour, curM = startMin;
            
            const currentNow = new Date();
            const isToday = selectedDateString === todayString;
            const currentHour = currentNow.getHours();
            const currentMin = currentNow.getMinutes();

            let slotsAdded = 0;

            while(curH < endHour || (curH === endHour && curM <= endMin)) {
                if (isToday) {
                    if (curH < currentHour || (curH === currentHour && curM <= currentMin)) {
                        curM += 30; if(curM >= 60) { curM = 0; curH++; }
                        continue;
                    }
                }

                let ampm = curH >= 12 ? 'PM' : 'AM';
                let dispH = curH > 12 ? curH - 12 : (curH === 0 ? 12 : curH);
                let dispM = curM === 0 ? '00' : '30';
                let timeStr = `${dispH}:${dispM} ${ampm}`;
                let valStr = `${curH.toString().padStart(2, '0')}:${dispM}`;
                
                let option = document.createElement('option');
                option.value = valStr; option.text = timeStr;
                timeSelect.appendChild(option);
                slotsAdded++;

                curM += 30; if(curM >= 60) { curM = 0; curH++; }
            }

            if(slotsAdded === 0) {
                timeSelect.innerHTML = '<option value="" disabled selected>No slots left for today.</option>';
                timeSelect.disabled = true;
            }
        });
    </script>

    <!-- FIREBASE INTEGRATION WITH FIRESTORE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyCiuGG-yNq5LUSbVgDaOY3SjzcCD0ywXyI",
  authDomain: "justplay-booking-engine.firebaseapp.com",
  projectId: "justplay-booking-engine",
  storageBucket: "justplay-booking-engine.firebasestorage.app",
  messagingSenderId: "275838911544",
  appId: "1:275838911544:web:c23d5f7054fb4f9b5592cd"
};


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const authSection = document.getElementById('auth-section');
        const bookingSection = document.getElementById('booking-section');
        const displayEmail = document.getElementById('display-email');
        const submitBtn = document.getElementById('submit-booking');
        const statusDisplay = document.getElementById('status-display');

        let currentUser = null;

        // Auth UI Toggle Logic
        let isLoginMode = true;
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const primaryAuthBtn = document.getElementById('btn-primary-auth');
        const toggleText = document.getElementById('auth-toggle-text');
        const toggleLink = document.getElementById('auth-toggle-link');

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            if(isLoginMode) {
                authTitle.innerText = "IDENTIFICATION REQUIRED";
                authSubtitle.innerText = "Sign in to view availability.";
                primaryAuthBtn.innerText = "Log In";
                toggleText.innerText = "Don't have an account?";
                toggleLink.innerText = "Create Account";
            } else {
                authTitle.innerText = "CREATE ACCOUNT";
                authSubtitle.innerText = "Register to secure your slots.";
                primaryAuthBtn.innerText = "Sign Up";
                toggleText.innerText = "Already have an account?";
                toggleLink.innerText = "Log In";
            }
        });

        // Auth Listeners
        document.getElementById('google-login-btn').addEventListener('click', () => signInWithPopup(auth, provider));
        
        primaryAuthBtn.addEventListener('click', () => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) return alert("Please enter email and password.");
            
            primaryAuthBtn.disabled = true;
            if(isLoginMode) {
                signInWithEmailAndPassword(auth, email, password).catch(err => {
                    alert("Login failed. Check your credentials.");
                    primaryAuthBtn.disabled = false;
                });
            } else {
                createUserWithEmailAndPassword(auth, email, password).catch(err => {
                    alert(err.message);
                    primaryAuthBtn.disabled = false;
                });
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                authSection.style.display = 'none';
                bookingSection.style.display = 'block';
                displayEmail.innerText = user.email;
                primaryAuthBtn.disabled = false;
            } else {
                authSection.style.display = 'block';
                bookingSection.style.display = 'none';
            }
        });

        // The Overlap Engine (Live Availability Checker)
        const checkTriggers = document.querySelectorAll('.check-trigger');
        
        async function checkAvailability() {
            const consoleVal = document.getElementById('console-type').value;
            const dateVal = document.getElementById('booking-date').value;
            const timeVal = document.getElementById('booking-time').value;
            const durationVal = document.getElementById('booking-duration').value;

            if(!consoleVal || !dateVal || !timeVal || !durationVal) return;

            statusDisplay.innerHTML = '<span style="color: #aaa;">Checking availability...</span>';
            submitBtn.disabled = true;

            const [hr, min] = timeVal.split(':');
            const reqStart = parseInt(hr) + (parseInt(min) / 60);
            const reqDuration = parseFloat(durationVal);
            const reqEnd = reqStart + reqDuration;

            const q = query(collection(db, "bookings"), where("date", "==", dateVal), where("console", "==", consoleVal));
            const querySnapshot = await getDocs(q);
            
            let overlaps = 0;
            const MAX_CAPACITY = 2; 

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if(reqStart < data.endTime && reqEnd > data.startTime) {
                    overlaps++;
                }
            });

            const available = MAX_CAPACITY - overlaps;

            if (available > 0) {
                statusDisplay.innerHTML = `<span style="color: #00ff00; text-shadow: 0 0 10px #00ff00;">🟢 ${available}/${MAX_CAPACITY} Slots Available</span>`;
                submitBtn.disabled = false;
            } else {
                statusDisplay.innerHTML = `<span style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">🔴 Fully Booked for this time</span>`;
                submitBtn.disabled = true;
            }
        }

        checkTriggers.forEach(trigger => trigger.addEventListener('change', checkAvailability));

        // Submit Booking to Firestore
        submitBtn.addEventListener('click', async () => {
            const nameVal = document.getElementById('booking-name').value;
            
            // Name Safety Check
            if(!nameVal) {
                alert("Please enter your full name.");
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Securing Slot...";
            
            const timeVal = document.getElementById('booking-time').value;
            const [hr, min] = timeVal.split(':');
            const reqStart = parseInt(hr) + (parseInt(min) / 60);
            
            try {
                await addDoc(collection(db, "bookings"), {
                    name: nameVal,
                    userEmail: currentUser.email,
                    console: document.getElementById('console-type').value,
                    date: document.getElementById('booking-date').value,
                    timeString: timeVal,
                    startTime: reqStart,
                    duration: parseFloat(document.getElementById('booking-duration').value),
                    endTime: reqStart + parseFloat(document.getElementById('booking-duration').value),
                    phone: document.getElementById('booking-phone').value || "None",
                    timestamp: new Date()
                });
                
                alert("Booking Confirmed! See you at Just Play.");
                window.location.reload(); 
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Error securing slot. Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Confirm Booking";
            }
        });
    </script>
</body>
</html>
