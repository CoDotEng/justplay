<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Play | Admin Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050505; color: #ffffff; font-family: 'Rajdhani', sans-serif;
            background-image: radial-gradient(circle at top, #1a0b2e 0%, #050505 100%);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }
        
        .glass-panel {
            background: rgba(15, 15, 15, 0.9); border: 1px solid rgba(176, 38, 255, 0.3);
            padding: 40px; border-radius: 8px; width: 100%; max-width: 500px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); text-align: center; margin-top: 50px;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; color: #b026ff; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        input {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333; color: #fff; border-radius: 4px;
            font-size: 1.1rem; font-family: 'Rajdhani', sans-serif; transition: 0.3s;
        }
        input:focus { outline: none; border-color: #b026ff; box-shadow: 0 0 10px rgba(176, 38, 255, 0.3); }

        .btn-primary { 
            background: #b026ff; color: #fff; border: none; 
            padding: 15px; width: 100%; font-size: 1.2rem; font-weight: bold; 
            text-transform: uppercase; cursor: pointer; border-radius: 4px; 
            transition: 0.3s ease-in-out; letter-spacing: 1px; margin-top: 10px;
        }
        .btn-primary:hover { background: #901ad6; box-shadow: 0 0 15px #b026ff; }
        
        .btn-secondary {
            background: transparent; color: #aaa; border: 1px solid #555; 
            padding: 10px; width: 100%; font-size: 1rem; font-weight: bold; 
            text-transform: uppercase; cursor: pointer; border-radius: 4px; 
            margin-top: 15px; transition: 0.3s;
        }
        .btn-secondary:hover { border-color: #fff; color: #fff; }

        .btn-notify {
            background: #00e5ff; color: #000; border: none; padding: 10px 15px; 
            border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: 10px;
            transition: 0.3s;
        }
        .btn-notify:hover { background: #00b3cc; box-shadow: 0 0 10px #00e5ff; }

        .text-link { color: #00e5ff; cursor: pointer; text-decoration: underline; font-size: 0.9rem; display: block; margin-top: 15px; }

        /* Dashboard Styles */
        #dashboard-section { display: none; width: 100%; max-width: 1000px; margin-top: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .header-buttons { display: flex; align-items: center; }
        
        .booking-card {
            background: rgba(20, 20, 20, 0.8); border-left: 4px solid #00e5ff;
            padding: 15px 20px; margin-bottom: 15px; border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .booking-info h3 { color: #00e5ff; margin-bottom: 5px; }
        .booking-info p { color: #aaa; font-size: 1.1rem; }
        .booking-meta { text-align: right; }
        .console-tag { background: #b026ff; color: #fff; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 0.9rem; display: inline-block; margin-bottom: 5px;}
        
        .btn-delete { background: #ff0044; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-delete:hover { background: #cc0036; }

    </style>
</head>
<body>

    <!-- AUTHENTICATION SECTION -->
    <div class="glass-panel" id="auth-section">
        <h2 style="margin-bottom: 20px; color: #fff; letter-spacing: 2px;">OWNER PORTAL</h2>
        
        <div class="input-group">
            <label>Email / Username</label>
            <input type="email" id="admin-email" placeholder="admin@justplay.com" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="admin-password" placeholder="••••••••" required>
        </div>

        <button class="btn-primary" id="btn-login">Secure Login</button>
        
        <button class="btn-secondary" id="btn-register">Create Account (First Time)</button>

        <span class="text-link" id="btn-forgot-password">Forgot Password? Send Reset Link</span>
        
        <div id="auth-message" style="margin-top: 15px; color: #ffaa00; font-weight: bold;"></div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section">
        <div class="header-bar">
            <h2>ALL UPCOMING BOOKINGS</h2>
            <div class="header-buttons">
                <button class="btn-notify" id="btn-enable-notify">🔔 Enable Notifications</button>
                <button class="btn-secondary" id="btn-logout" style="width: auto; margin: 0;">Logout</button>
            </div>
        </div>
        
        <div id="bookings-container">
            <!-- Bookings will load here -->
        </div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, deleteDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-messaging.js"; // IMPORT MESSAGING

        const firebaseConfig = {
            apiKey: "AIzaSyCiuGG-yNq5LUSbVgDaOY3SjzcCD0ywXyI",
            authDomain: "justplay-booking-engine.firebaseapp.com",
            projectId: "justplay-booking-engine",
            storageBucket: "justplay-booking-engine.firebasestorage.app",
            messagingSenderId: "275838911544",
            appId: "1:275838911544:web:c23d5f7054fb4f9b5592cd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const messaging = getMessaging(app); // INITIALIZE MESSAGING

        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const authMessage = document.getElementById('auth-message');
        const emailInput = document.getElementById('admin-email');
        const pwdInput = document.getElementById('admin-password');

        // Login
        document.getElementById('btn-login').addEventListener('click', () => {
            const email = emailInput.value.trim();
            const pwd = pwdInput.value.trim();
            if(!email || !pwd) return authMessage.innerText = "Enter email and password.";
            
            authMessage.innerText = "Authenticating...";
            signInWithEmailAndPassword(auth, email, pwd)
                .catch(error => authMessage.innerText = error.message);
        });

        // Register
        document.getElementById('btn-register').addEventListener('click', () => {
            const email = emailInput.value.trim();
            const pwd = pwdInput.value.trim();
            if(!email || !pwd) return authMessage.innerText = "Enter email and password to create account.";
            
            authMessage.innerText = "Creating account...";
            createUserWithEmailAndPassword(auth, email, pwd)
                .then(() => authMessage.innerText = "Account created! You are logged in.")
                .catch(error => authMessage.innerText = error.message);
        });

        // Forgot Password
        document.getElementById('btn-forgot-password').addEventListener('click', () => {
            const email = emailInput.value.trim();
            if(!email) return authMessage.innerText = "Type your email above first, then click reset.";
            
            sendPasswordResetEmail(auth, email)
                .then(() => authMessage.innerText = "Reset link sent to your email!")
                .catch(error => authMessage.innerText = error.message);
        });

        // Logout
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
        });

        // Auth Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authSection.style.display = 'none';
                dashboardSection.style.display = 'block';
                loadBookings(); 
            } else {
                authSection.style.display = 'block';
                dashboardSection.style.display = 'none';
                emailInput.value = '';
                pwdInput.value = '';
                authMessage.innerText = '';
            }
        });

        // --- PUSH NOTIFICATION LOGIC ---
        document.getElementById('btn-enable-notify').addEventListener('click', async () => {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const token = await getToken(messaging, { vapidKey: "BBzj3MGUlJyoI16QO5ojSomHcseyx703nbUPDnF-7Yir9YJ4j8Zdwr5FmDEP0Rb8FRbbDUcEWMcXmZfsYIaTRdY" });
                    
                    if (token) {
                        console.log("FCM Token Generated:", token);
                        alert("Permission granted! Linking your phone to the admin channel...");
                        
                        // Send this token to our backend to subscribe to the 'admin' topic
                        await fetch('/api/subscribe', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: token })
                        });
                        
                        alert("Success! Your phone is now officially listening for Daily Summaries.");
                    } else {
                        alert("Failed to generate token. Check your VAPID key.");
                    }
                } else {
                    alert("You denied the notification permission!");
                }
            } catch (error) {
                console.error("Error enabling notifications:", error);
                alert("Error enabling notifications. Check console.");
            }
        });

        // --- DASHBOARD LOGIC (Master List View) ---
        const container = document.getElementById('bookings-container');
        let unsubscribe = null;

        // 🚨 HOURLY RATES (Update these to match his exact shop prices)
        const RATES = {
            "PC": 110,         // ₹110 per hour
            "PS5_42": 120,     // ₹130 per hour
            "PS5_65": 130,     // ₹160 per hour
            "SIM": 150         // ₹200 per hour
        };

        function loadBookings() {
            if(unsubscribe) unsubscribe();

            const now = new Date();
            const todayString = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

            const q = query(
                collection(db, "bookings"), 
                where("date", ">=", todayString), 
                orderBy("date", "asc"), 
                orderBy("startTime", "asc")
            );
            
            unsubscribe = onSnapshot(q, (snapshot) => {
                container.innerHTML = '';
                
                if(snapshot.empty) {
                    container.innerHTML = '<p style="color: #aaa; text-align: center; margin-top: 30px;">No upcoming bookings found.</p>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    
                    const durationText = data.duration === 0.5 ? "30 Mins" : `${data.duration} Hour(s)`;
                    
                    // Billing Calculation
                    const hourlyRate = RATES[data.console] || 100; // Fallback to 100 if console isn't found
                    const totalBill = hourlyRate * data.duration;

                    const card = document.createElement('div');
                    card.className = 'booking-card';
                    card.innerHTML = `
                        <div class="booking-info">
                            <h3>${data.name}</h3>
                            <p>📞 ${data.phone}</p>
                            <p style="margin-top: 5px; font-weight: bold; color: #fff;">📅 ${data.date} | ⏰ ${data.timeString} (${durationText})</p>
                            <p style="margin-top: 5px; font-weight: bold; color: #00ff00; font-size: 1.3rem;">💰 Bill: ₹${totalBill}</p>
                        </div>
                        <div class="booking-meta">
                            <span class="console-tag">${data.console}</span><br>
                            <button class="btn-delete" data-id="${docId}">Cancel Slot</button>
                        </div>
                    `;
                    container.appendChild(card);
                });

                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if(confirm("Are you sure you want to delete this booking?")) {
                            await deleteDoc(doc(db, "bookings", id));
                        }
                    });
                });
            }, (error) => {
                if(error.message.includes("requires an index")) {
                    const linkMatch = error.message.match(/https:\/\/console\.firebase\.google\.com[^\s]*/);
                    const link = linkMatch ? linkMatch[0] : '#';
                    container.innerHTML = `
                        <div style="background: rgba(255,0,0,0.2); padding: 20px; border: 1px solid red; border-radius: 8px; text-align: center;">
                            <h3 style="color: #ff4444; margin-bottom: 10px;">Database Sort Index Required</h3>
                            <p>Firebase requires a new composite index to sort by Date + Time simultaneously.</p>
                            <a href="${link}" target="_blank" style="display: inline-block; margin-top: 15px; background: #ff4444; color: white; padding: 12px 20px; text-decoration: none; border-radius: 4px; font-weight: bold;">CLICK HERE TO AUTO-BUILD INDEX</a>
                            <p style="margin-top: 15px; font-size: 0.9rem; color: #aaa;">After clicking the link, wait 3-5 minutes for Firebase to build it, then refresh this page.</p>
                        </div>
                    `;
                } else {
                    console.error("Dashboard Error: ", error);
                }
            });
        }
    </script>
</body>
</html>
