<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <title>Just Play | Admin Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050505; color: #ffffff; font-family: 'Rajdhani', sans-serif;
            min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column;
        }

        /* FIXED: Added missing closing bracket '}' below */
        h1, h2, h3, .brand { font-family: 'Orbitron', sans-serif; } 
        
        header { 
            background: rgba(15, 15, 15, 0.95); padding: 20px; text-align: center; 
            border-bottom: 2px solid #b026ff; box-shadow: 0 4px 15px rgba(176, 38, 255, 0.2);
            position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center;
        }
        
        .brand { font-size: 1.5rem; color: #fff; text-shadow: 0 0 10px #b026ff; letter-spacing: 2px; }
        .logout-btn { background: none; border: 1px solid #ff0055; color: #ff0055; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-family: 'Rajdhani'; font-weight: bold; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; padding: 20px; }
        .login-box { background: rgba(20,20,20,0.8); border: 1px solid #333; padding: 40px; border-radius: 8px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 0 20px #000; }
        .input-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #444; color: #fff; border-radius: 4px; font-family: 'Rajdhani'; font-size: 1.1rem; }
        .btn-auth { background: #b026ff; color: #fff; border: none; padding: 12px; width: 100%; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; }
        .btn-auth:hover { background: #901ad6; box-shadow: 0 0 15px #b026ff; }
        .btn-google {
            background: #fff; color: #050505; border: none; padding: 12px; width: 100%;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 4px;
            display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; margin-top: 10px;
        }
        .btn-google:hover { background: #ccc; }
        .divider { display: flex; align-items: center; text-align: center; margin: 15px 0; color: #555; font-size: 0.9rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #333; }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
        #dashboard-screen { display: none; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header-actions { display: flex; gap: 10px; }
        .refresh-btn { background: #00e5ff; color: #000; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; font-family: 'Rajdhani'; }
        .add-btn { background: #b026ff; color: #fff; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; font-family: 'Rajdhani'; }
        .bookings-container { display: flex; flex-direction: column; gap: 15px; }
        .card { 
            background: rgba(20, 20, 20, 0.9); border-left: 4px solid #b026ff; 
            padding: 20px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 10px; position: relative;
        }
        .card.PC { border-left-color: #00e5ff; }
        .card.PS5_42 { border-left-color: #b026ff; }
        .card.PS5_65 { border-left-color: #ff00ea; }
        .card.SIM { border-left-color: #ff3300; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .customer-name { font-size: 1.4rem; font-weight: bold; color: #fff; }
        .console-badge { background: #333; padding: 4px 10px; border-radius: 4px; font-size: 0.9rem; font-family: 'Orbitron'; letter-spacing: 1px; color: #fff; }
        .card-details { color: #aaa; font-size: 1.1rem; line-height: 1.5; }
        .highlight { color: #00e5ff; font-weight: bold; }
        .price-highlight { color: #25D366; font-weight: bold; font-size: 1.2rem; }
        .card-actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-wa { background: #25D366; color: #000; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; text-align: center; flex: 1; }
        .btn-del { background: transparent; color: #ff0055; border: 1px solid #ff0055; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .empty-state { text-align: center; color: #555; margin-top: 50px; font-size: 1.2rem; }
        #walkin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: #111; padding: 25px; border-radius: 8px; width: 100%; max-width: 400px;
            border: 1px solid #b026ff; box-shadow: 0 0 20px rgba(176, 38, 255, 0.3);
        }
        .modal-content h3 { color: #b026ff; margin-bottom: 15px; text-align: center; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: transparent; border: 1px solid #555; color: #fff; padding: 10px; flex: 1; border-radius: 4px; cursor: pointer; }
        .btn-submit { background: #b026ff; border: none; color: #fff; padding: 10px; flex: 2; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="brand">JP ADMIN</div>
        <button class="logout-btn" id="btn-logout" style="display:none;">EXIT</button>
    </header>
    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-bottom: 20px; color: #b026ff;">COMMAND CENTER</h2>
            <button class="btn-google" id="google-admin-btn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Sign In with Google
            </button>
            <div class="divider">OR USE PASSWORD</div>
            <div class="input-group">
                <input type="email" id="admin-email" placeholder="Admin Email">
            </div>
            <div class="input-group">
                <input type="password" id="admin-password" placeholder="Password">
            </div>
            <button class="btn-auth" id="btn-login">Log In</button>
            <p id="login-error" style="color: #ff0055; margin-top: 15px; display: none; font-weight: bold;"></p>
        </div>
    </div>
    <div id="dashboard-screen">
        <div class="dashboard-header">
            <h2>LIVE LOGS</h2>
            <div class="header-actions">
                <button id="enable-pings-btn" class="btn-neon" style="margin-bottom: 20px; width: auto; padding: 10px 20px;">Enable Lock Screen Pings 🔔</button>
                <button class="add-btn" id="btn-open-modal">+ Walk-In</button>
                <button class="refresh-btn" id="btn-refresh">↻</button>
            </div>
        </div>
        <div class="bookings-container" id="bookings-list">
            <div class="empty-state">Loading backend data...</div>
        </div>
    </div>
    <div id="walkin-modal">
        <div class="modal-content">
            <h3>ADD WALK-IN CUSTOMER</h3>
            <form id="walkin-form">
                <div class="input-group">
                    <input type="text" id="w-name" placeholder="Customer Name" required>
                </div>
                <div class="input-group">
                    <select id="w-console" required>
                        <option value="PC">PC Setup</option>
                        <option value="PS5_42">PS5 (42")</option>
                        <option value="PS5_65">PS5 MAX (65")</option>
                        <option value="SIM">Sim Racing Rig</option>
                    </select>
                </div>
                <div class="input-group" style="display:flex; gap:10px;">
                    <input type="date" id="w-date" required>
                    <input type="time" id="w-time" required>
                </div>
                <div class="input-group">
                    <select id="w-duration" required>
                        <option value="1">1 Hour</option>
                        <option value="2">2 Hours</option>
                        <option value="3">3 Hours</option>
                        <option value="4">4 Hours</option>
                        <option value="5">5 Hours</option>
                    </select>
                </div>
                <div class="input-group">
                    <input type="tel" id="w-phone" placeholder="Phone (Optional)">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btn-close-modal">Cancel</button>
                    <button type="submit" class="btn-submit">Add Booking</button>
                </div>
            </form>
        </div>
    </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-messaging.js";
    import { getMessaging as getMessagingDupe, getToken as getTokenDupe } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-messaging.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyCiuGG-yNq5LUSbVgDaOY3SjzcCD0ywXyI",
      authDomain: "justplay-booking-engine.firebaseapp.com",
      projectId: "justplay-booking-engine",
      storageBucket: "justplay-booking-engine.firebasestorage.app",
      messagingSenderId: "275838911544",
      appId: "1:275838911544:web:c23d5f7054fb4f9b5592cd"
    };
    
    const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const messaging = getMessaging(app);
        const provider = new GoogleAuthProvider();
        const ADMIN_EMAIL = "ayiraditya09@gmail.com"; 
        const RATE_CARD = {
            "PC": 110,    
            "PS5_42": 120,    
            "PS5_65": 130,    
            "SIM": 150       
        };
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const logoutBtn = document.getElementById('btn-logout');
        const errorMsg = document.getElementById('login-error');
        const bookingsList = document.getElementById('bookings-list');
        const modal = document.getElementById('walkin-modal');
        const dateInput = document.getElementById('w-date');
        const timeInput = document.getElementById('w-time');
        
        document.getElementById('google-admin-btn').addEventListener('click', () => {
            errorMsg.style.display = 'none';
            signInWithPopup(auth, provider).catch(err => {
                errorMsg.innerText = "Google Sign-In Failed: " + err.message;
                errorMsg.style.display = "block";
            });
        });
        
        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
           
            errorMsg.style.display = 'none';
            signInWithEmailAndPassword(auth, email, password).catch(err => {
                errorMsg.innerText = "Access Denied: Invalid Credentials";
                errorMsg.style.display = "block";
            });
        });
        
        logoutBtn.addEventListener('click', () => signOut(auth));
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    loginScreen.style.display = 'none';
                    dashboardScreen.style.display = 'block';
                    logoutBtn.style.display = 'block';
                    errorMsg.style.display = 'none';
                    fetchBookings();
                } else {
                    signOut(auth);
                    errorMsg.innerText = `Access Denied: ${user.email} is not authorized.`;
                    errorMsg.style.display = "block";
                }
            } else {
                loginScreen.style.display = 'flex';
                dashboardScreen.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });
        
        const consoleNames = {
            "PC": "PC Setup",
            "PS5_42": "PS5 (42\")",
            "PS5_65": "PS5 MAX (65\")",
            "SIM": "Sim Racing Rig"
        };
        
        async function fetchBookings() {
            bookingsList.innerHTML = '<div class="empty-state">Syncing secure connection...</div>';
            try {
                const querySnapshot = await getDocs(collection(db, "bookings"));
                let bookings = [];
                querySnapshot.forEach((doc) => {
                    bookings.push({ id: doc.id, ...doc.data() });
                });
                bookings.sort((a, b) => (b.timestamp?.toMillis?.() || 0) - (a.timestamp?.toMillis?.() || 0));

                if (bookings.length === 0) {
                    bookingsList.innerHTML = '<div class="empty-state">No bookings currently active.</div>';
                    return;
                }
                bookingsList.innerHTML = '';
                bookings.forEach(b => {
                    const card = document.createElement('div');
                    card.className = `card ${b.console}`;
                    const dateObj = new Date(b.date);
                    const niceDate = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                    const durationHours = parseFloat(b.duration) || 1;
                    const hourlyRate = RATE_CARD[b.console] || 0;
                    const totalDue = hourlyRate * durationHours;
                    let waButton = '';
                    if (b.phone && b.phone !== "None" && b.phone.length >= 10) {
                        let cleanPhone = b.phone.replace(/\D/g,'');
                        if(cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;
                        waButton = `<a href="https://wa.me/${cleanPhone}" target="_blank" class="btn-wa">WhatsApp</a>`;
                    }
                    const accountDisplay = b.userEmail === "Walk-In (Admin)" ? '<span style="color:#b026ff;">Walk-In (Counter)</span>' : b.userEmail;
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="customer-name">${b.name || 'Anonymous Player'}</div>
                            <div class="console-badge">${consoleNames[b.console] || b.console}</div>
                        </div>
                        <div class="card-details">
                            Date: <span class="highlight">${niceDate}</span><br>
                            Time: <span class="highlight">${b.timeString}</span> (${durationHours} Hours)<br>
                            Amount Due: <span class="price-highlight">₹${totalDue}</span><br>
                            Account: ${accountDisplay}<br>
                            Phone: ${b.phone || 'N/A'}
                        </div>
                        <div class="card-actions">
                            ${waButton}
                            <button class="btn-del" onclick="deleteBooking('${b.id}')">Cancel / Checkout</button>
                        </div>
                    `;
                    bookingsList.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching bookings: ", error);
                bookingsList.innerHTML = '<div class="empty-state" style="color:#ff0055;">Error fetching backend data.</div>';
            }
        }
        
        document.getElementById('btn-refresh').addEventListener('click', fetchBookings);
        
        window.deleteBooking = async function(id) {
            if(confirm("Checkout this player and free up the slot?")) {
                try {
                    await deleteDoc(doc(db, "bookings", id));
                    fetchBookings();
                } catch (e) {
                    alert("Error deleting slot.");
                    console.error(e);
                }
            }

        }
        
        function enforceTimeLimit() {
            const now = new Date();
            const todayStr = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            if (dateInput.value === todayStr) {
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                timeInput.min = `${hours}:${minutes}`;
            } else {
                /* FIXED: Removed stray 's' character at the end of this line */
                timeInput.min = ""; 
            }
        }

        dateInput.addEventListener('change', enforceTimeLimit);

        document.getElementById('btn-open-modal').addEventListener('click', () => {
            const now = new Date();
            const todayStr = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
   
            dateInput.min = todayStr;
            dateInput.value = todayStr;
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            timeInput.value = `${hours}:${minutes}`;
           
            enforceTimeLimit();
            modal.style.display = 'flex';
        });

        document.getElementById('btn-close-modal').addEventListener('click', () => {
            modal.style.display = 'none';
        });

        document.getElementById('walkin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const selectedDateTime = new Date(`${dateInput.value}T${timeInput.value}`);
            if (selectedDateTime < new Date()) {
                alert("Hold up! You cannot book a slot in the past. Select a valid time.");
                return;
            }
            const btnSubmit = document.querySelector('.btn-submit');
            btnSubmit.innerText = "Adding...";
            btnSubmit.disabled = true;
            const newBooking = {
                name: document.getElementById('w-name').value,
                console: document.getElementById('w-console').value,
                date: document.getElementById('w-date').value,
                timeString: document.getElementById('w-time').value,
                duration: document.getElementById('w-duration').value,
                phone: document.getElementById('w-phone').value || "None",
                userEmail: "Walk-In (Admin)", // Flags it as an offline walk-in
                timestamp: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "bookings"), newBooking);
                document.getElementById('walkin-form').reset();
                modal.style.display = 'none';
                fetchBookings(); // Refresh the list instantly
            } catch (error) {
                alert("Failed to add walk-in: " + error.message);
            } finally {
                btnSubmit.innerText = "Add Booking";
                btnSubmit.disabled = false;
            }
        });

    const enablePingsBtn = document.getElementById('enable-pings-btn');
    if (enablePingsBtn) {
        enablePingsBtn.addEventListener('click', async () => {
            try {
                const permission = await Notification.requestPermission();
               
                if (permission === 'granted') {
                    // REPLACE THIS STRING WITH YOUR VAPID KEY
                    const currentToken = await getToken(messaging, { 
                        vapidKey: "BBzj3MGUlJyoI16QO5ojSomHcseyx703nbUPDnF-7Yir9YJ4j8Zdwr5FmDEP0Rb8FRbbDUcEWMcXmZfsYIaTRdY" 
                    });
                   
                    if (currentToken) {
                        await setDoc(doc(db, "admin_settings", "push_token"), { 
                            token: currentToken,
                            updatedAt: new Date()
                        });
                        alert("Lock screen pings are LIVE! 🔔");
                        enablePingsBtn.style.display = 'none';
                    } else {
                        console.log('No registration token available.');
                    }
                } else {
                    alert("You denied permission. You won't get live pings.");
                }
            } catch (error) {
                console.error("An error occurred while retrieving token. ", error);
            }
        });
    }
  </script>
    <!-- FIXED: Removed duplicate </script> tag here -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(() => console.log('PWA Service Worker Active'))
                    .catch(err => console.error('Service Worker Error: ', err));
            });
        }
    </script>
</body>
</html>
