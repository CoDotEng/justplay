  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PWA Meta Tags (Makes it act like a native phone app) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/GitHub_Invertocat_Logo.svg/1024px-GitHub_Invertocat_Logo.svg.png"> <!-- Placeholder icon -->

    <title>Just Play | Admin Dashboard</title>
  <link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050505; color: #ffffff; font-family: 'Rajdhani', sans-serif;
            min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column;
        }

        h1, h2, h3, .brand { font-family: 'Orbitron', sans-serif; }
        
        /* Top App Bar */
        header { 
            background: rgba(15, 15, 15, 0.95); padding: 20px; text-align: center; 
            border-bottom: 2px solid #b026ff; box-shadow: 0 4px 15px rgba(176, 38, 255, 0.2);
            position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center;
        }
        
        .brand { font-size: 1.5rem; color: #fff; text-shadow: 0 0 10px #b026ff; letter-spacing: 2px; }
        .logout-btn { background: none; border: 1px solid #ff0055; color: #ff0055; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-family: 'Rajdhani'; font-weight: bold; }

        /* Login Screen */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; padding: 20px; }
        .login-box { background: rgba(20,20,20,0.8); border: 1px solid #333; padding: 40px; border-radius: 8px; text-align: center; width: 100%; max-width: 400px; box-shadow: 0 0 20px #000; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #444; color: #fff; border-radius: 4px; font-family: 'Rajdhani'; font-size: 1.1rem; }
        .btn-neon { background: transparent; color: #00e5ff; border: 2px solid #00e5ff; padding: 12px; width: 100%; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.3s; margin-top: 10px; }
        .btn-neon:hover { background: #00e5ff; color: #000; box-shadow: 0 0 15px #00e5ff; }

        /* Dashboard Screen */
        #dashboard-screen { display: none; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .refresh-btn { background: #00e5ff; color: #000; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }

        /* Booking Cards */
        .bookings-container { display: flex; flex-direction: column; gap: 15px; }
        .card { 
            background: rgba(20, 20, 20, 0.9); border-left: 4px solid #b026ff; 
            padding: 20px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 10px; position: relative;
        }
        
        /* Dynamic Console Colors */
        .card.PC { border-left-color: #00e5ff; }
        .card.PS5_42 { border-left-color: #b026ff; }
        .card.PS5_65 { border-left-color: #ff00ea; }
        .card.SIM { border-left-color: #ff3300; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .customer-name { font-size: 1.4rem; font-weight: bold; color: #fff; }
        .console-badge { background: #333; padding: 4px 10px; border-radius: 4px; font-size: 0.9rem; font-family: 'Orbitron'; letter-spacing: 1px; color: #fff; }
        
        .card-details { color: #aaa; font-size: 1.1rem; }
        .highlight { color: #00e5ff; font-weight: bold; }

        .card-actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-wa { background: #25D366; color: #000; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; text-align: center; flex: 1; }
        .btn-del { background: transparent; color: #ff0055; border: 1px solid #ff0055; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        .empty-state { text-align: center; color: #555; margin-top: 50px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <div class="brand">JP ADMIN</div>
        <button class="logout-btn" id="btn-logout" style="display:none;">EXIT</button>
    </header>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-bottom: 20px; color: #b026ff;">COMMAND CENTER</h2>
            <div class="input-group">
                <input type="email" id="admin-email" placeholder="Admin Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="admin-password" placeholder="Password" required>
            </div>
            <button class="btn-neon" id="btn-login">Access Systems</button>
            <p id="login-error" style="color: #ff0055; margin-top: 15px; display: none;"></p>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-screen">
        <div class="dashboard-header">
            <h2>LIVE LOGS</h2>
            <button class="refresh-btn" id="btn-refresh">↻ Refresh</button>
        </div>
        
        <div class="bookings-container" id="bookings-list">
            <div class="empty-state">Loading backend data...</div>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyCiuGG-yNq5LUSbVgDaOY3SjzcCD0ywXyI",
  authDomain: "justplay-booking-engine.firebaseapp.com",
  projectId: "justplay-booking-engine",
  storageBucket: "justplay-booking-engine.firebasestorage.app",
  messagingSenderId: "275838911544",
  appId: "1:275838911544:web:c23d5f7054fb4f9b5592cd"
};


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ⚠️ SET THE OWNER'S EMAIL HERE ⚠️
        const ADMIN_EMAIL = "ayiraditya09@gmail.com"; 

        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const logoutBtn = document.getElementById('btn-logout');
        const errorMsg = document.getElementById('login-error');
        const bookingsList = document.getElementById('bookings-list');

        // Admin Login Logic
        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            
            signInWithEmailAndPassword(auth, email, password).catch(err => {
                errorMsg.innerText = "Access Denied: Invalid Credentials";
                errorMsg.style.display = "block";
            });
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        // State Change Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email === ADMIN_EMAIL) {
                    loginScreen.style.display = 'none';
                    dashboardScreen.style.display = 'block';
                    logoutBtn.style.display = 'block';
                    fetchBookings(); // Load data
                } else {
                    // Kick out non-admins
                    signOut(auth);
                    errorMsg.innerText = "Access Denied: Unauthorized Clearance";
                    errorMsg.style.display = "block";
                }
            } else {
                loginScreen.style.display = 'flex';
                dashboardScreen.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });

        // Dictionary to make console IDs look nice
        const consoleNames = {
            "PC": "PC Setup",
            "PS5_42": "PS5 (42\")",
            "PS5_65": "PS5 MAX (65\")",
            "SIM": "Sim Racing Rig"
        };

        // Fetch and Draw Bookings
        async function fetchBookings() {
            bookingsList.innerHTML = '<div class="empty-state">Syncing secure connection...</div>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "bookings"));
                let bookings = [];
                
                querySnapshot.forEach((doc) => {
                    bookings.push({ id: doc.id, ...doc.data() });
                });

                // Sort by timestamp (newest first)
                bookings.sort((a, b) => b.timestamp.toMillis() - a.timestamp.toMillis());

                if (bookings.length === 0) {
                    bookingsList.innerHTML = '<div class="empty-state">No bookings found in the database.</div>';
                    return;
                }

                bookingsList.innerHTML = ''; // Clear container

                bookings.forEach(b => {
                    const card = document.createElement('div');
                    card.className = `card ${b.console}`;
                    
                    // Format Date nicely
                    const dateObj = new Date(b.date);
                    const niceDate = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

                    // WhatsApp button logic
                    let waButton = '';
                    if (b.phone && b.phone !== "None" && b.phone.length >= 10) {
                        // Strip non-numbers from phone
                        let cleanPhone = b.phone.replace(/\D/g,'');
                        // Assume India (+91) if 10 digits
                        if(cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;
                        waButton = `<a href="https://wa.me/${cleanPhone}" target="_blank" class="btn-wa">WhatsApp</a>`;
                    }

                    card.innerHTML = `
                        <div class="card-header">
                            <div class="customer-name">${b.name}</div>
                            <div class="console-badge">${consoleNames[b.console] || b.console}</div>
                        </div>
                        <div class="card-details">
                            Date: <span class="highlight">${niceDate}</span><br>
                            Time: <span class="highlight">${b.timeString}</span> (${b.duration} Hours)<br>
                            Phone: ${b.phone}
                        </div>
                        <div class="card-actions">
                            ${waButton}
                            <button class="btn-del" onclick="deleteBooking('${b.id}')">Cancel Slot</button>
                        </div>
                    `;
                    bookingsList.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching bookings: ", error);
                bookingsList.innerHTML = '<div class="empty-state" style="color:red;">Error fetching backend data.</div>';
            }
        }

        document.getElementById('btn-refresh').addEventListener('click', fetchBookings);

        // Make delete function globally accessible to the HTML buttons
        window.deleteBooking = async function(id) {
            if(confirm("Are you sure you want to delete this booking? This will free up the slot immediately.")) {
                try {
                    await deleteDoc(doc(db, "bookings", id));
                    fetchBookings(); // Refresh list automatically
                } catch (e) {
                    alert("Error deleting slot.");
                    console.error(e);
                }
            }
        }
    </script>
</body>
</html>
